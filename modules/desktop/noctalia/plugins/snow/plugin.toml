id          = "xm1k/snow"
name        = "Snow"
version     = "1.1.0"
plugin_api  = 52
author      = "xm1k"
license     = "MIT"
icon        = "snowflake"
description = "Falling snow over the wallpaper; comes in front of windows when idle. Level: `snow 0..10`."
tags        = ["fun", "animation"]

[[setting]]
key       = "max_flakes"
type      = "int"
label_key = "settings.max_flakes.label"
default   = 220
min       = 20
max       = 400

[[setting]]
key       = "speed"
type      = "double"
label_key = "settings.speed.label"
default   = 1.0
min       = 0.2
max       = 3.0
step      = 0.1

[[setting]]
key       = "opacity"
type      = "double"
label_key = "settings.opacity.label"
default   = 0.8
min       = 0.1
max       = 1.0
step      = 0.05

[[setting]]
key       = "idle_seconds"
type      = "int"
label_key = "settings.idle_seconds.label"
default   = 120
min       = 10
max       = 3600

# Holds the level (persisted) and the idle watch; publishes both via noctalia.state.
[[service]]
id    = "ctl"
entry = "service.luau"

[[layer]]
id             = "snow"
entry          = "snow.luau"
layer          = "bottom"
anchors        = ["top", "bottom", "left", "right"]
exclusive_zone = -1
keyboard       = "none"
click_through  = true
visible        = true
